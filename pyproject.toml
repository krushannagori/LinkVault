[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkvault"
version = "2.0.0"
description = "Encrypted desktop bookmark and safe link manager with AES-256-GCM, atomic saves, and zero-dependency fallback."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Krishna Nagori", email = "krishna.nagori@infomericainc.in" },
]
keywords = ["security", "encryption", "aes-gcm", "bookmarks", "password-manager", "tkinter", "desktop"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security :: Cryptography",
  "Topic :: Utilities",
]
dependencies = [
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
  "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/krushannagori/LinkVault"
Repository = "https://github.com/krushannagori/LinkVault"
Issues = "https://github.com/krushannagori/LinkVault/issues"

[project.gui-scripts]
linkvault = "linkvault.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
